<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Редактор кампаний Keitaro</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Редактор кампании</h1>
  <label>Кампания: <select id="campaign"></select></label>
  <button id="load">Загрузить</button>
  <div id="streams"></div>
  <script>
    async function loadCampaigns() {
      const camps = await (await fetch('/api/editor/campaigns')).json();
      const sel = document.getElementById('campaign');
      sel.innerHTML = '';
      camps.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id;
        o.textContent = c.name + ' (id ' + c.id + ')';
        sel.appendChild(o);
      });
    }
    loadCampaigns();

    document.getElementById('load').addEventListener('click', async () => {
      const cid = document.getElementById('campaign').value;
      const streams = await (await fetch('/api/editor/campaigns/' + cid + '/streams')).json();
      const offers = await (await fetch('/api/editor/offers')).json();
      const container = document.getElementById('streams');
      container.innerHTML = '';
      streams.forEach(s => {
        const div = document.createElement('div');
        div.className = 'stream';
        const title = document.createElement('h3');
        title.textContent = (s.name || 'Stream') + ' (id ' + s.id + ')';
        div.appendChild(title);
        const offersDiv = document.createElement('div');
        offersDiv.innerHTML = '<b>Офферы:</b> ' + (s.offers||[]).map(o=>o.offer_id).join(', ');
        div.appendChild(offersDiv);

        // add offer select
        const sel = document.createElement('select');
        sel.id = 'addsel_' + s.id;
        offers.forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.id;
          opt.textContent = o.name + ' (id ' + o.id + ')';
          sel.appendChild(opt);
        });
        div.appendChild(sel);
        const addBtn = document.createElement('button');
        addBtn.textContent = 'Добавить оффер';
        addBtn.onclick = async () => {
          const oid = parseInt(document.getElementById('addsel_'+s.id).value);
          const r = await fetch('/api/editor/streams/' + s.id + '/offers/add', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({offer_id: oid})});
          const j = await r.json();
          alert(JSON.stringify(j));
          document.getElementById('load').click();
        };
        div.appendChild(addBtn);

        // remove offer select
        const sel2 = document.createElement('select');
        sel2.id = 'remsel_' + s.id;
        (s.offers||[]).forEach(o => {
          const opt = document.createElement('option');
          opt.value = o.offer_id;
          opt.textContent = o.offer_id;
          sel2.appendChild(opt);
        });
        div.appendChild(sel2);
        const remBtn = document.createElement('button');
        remBtn.textContent = 'Удалить оффер';
        remBtn.onclick = async () => {
          const oid = parseInt(document.getElementById('remsel_'+s.id).value);
          const r = await fetch('/api/editor/streams/' + s.id + '/offers/remove', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({offer_id: oid})});
          const j = await r.json();
          alert(JSON.stringify(j));
          document.getElementById('load').click();
        };
        div.appendChild(remBtn);

        container.appendChild(div);
      });
    });
  </script>
</body>
</html>
