<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор кампаний — Keitaro Wrapper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .offer-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .offer-table th, .offer-table td { padding: 10px 8px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: left; vertical-align: middle; }
    .offer-table th { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--gray); font-weight: 700; }
    .offer-table tr.archived { opacity: 0.45; background: rgba(0,0,0,0.08); }
    .offer-table input.weight-input { width: 64px; padding: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--ivory); font-family: 'JetBrains Mono', monospace; }
    .pin-btn { cursor: pointer; background: none; border: none; font-size: 16px; color: var(--gray); }
    .pin-btn.pinned { color: var(--red); }
    .status-archived { color: var(--gray); font-style: italic; }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="logo"><div class="logo-mark">K</div><span>Keitaro Wrapper</span></a>
      <div class="topbar-actions">
        <nav class="topbar-nav">
          <a href="/">Главная</a>
          <a href="/creator">Создаватор</a>
          <a href="/editor" class="active">Редактор</a>
        </nav>
        <div class="status-dot">Подключено к Keitaro</div>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top: 32px;">
    <div class="hero" style="padding: 16px 0 24px;">
      <h1 style="font-size:clamp(40px,6vw,72px);">Редактор<br><span class="red">кампаний.</span></h1>
      <p>Добавляйте, удаляйте и распределяйте веса офферов. Изменения применяются по кнопке.</p>
    </div>

    <div class="editor-layout fade-in">
      <div class="campaign-list">
        <input class="search-box" id="search" placeholder="Поиск кампании…">
        <div id="campaigns"></div>
      </div>

      <div>
        <div style="padding:20px; border:1px solid var(--ivory); border-bottom:none; background:var(--ivory); color:var(--black); display:flex; gap:12px; align-items:center;">
          <select id="campaign" style="flex:1; padding:12px; border:1px solid var(--black); background:var(--bg); color:var(--ivory); font-size:13px;"></select>
          <button id="load" class="btn btn-primary">Загрузить</button>
        </div>
        <div id="streams"></div>
        <div class="log-box">
          <div class="preview-title">Лог изменений</div>
          <div id="log"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    let allCampaigns = [];
    let allOffers = [];
    let streamStates = {}; // streamId -> {offers:[], dirty:bool}

    function showToast(msg, err=false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (err ? ' error' : '');
      setTimeout(() => t.className = 'toast', 3500);
    }
    function log(msg) {
      const d = document.getElementById('log');
      const e = document.createElement('div');
      e.className = 'log-entry';
      e.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
      d.prepend(e);
    }

    function getSt(sid) { return streamStates[sid]; }

    function recalcWeights(st) {
      const active = st.offers.filter(o => o.status === 'active');
      const pinned = active.filter(o => o.pinned);
      const unpinned = active.filter(o => !o.pinned);
      const pinnedSum = pinned.reduce((s,o) => s + (o.weight||0), 0);
      let remaining = 100 - pinnedSum;
      if (remaining < 0) remaining = 0;
      if (unpinned.length > 0) {
        const base = Math.floor(remaining / unpinned.length);
        let leftover = remaining - base * unpinned.length;
        unpinned.forEach((o, i) => { o.weight = base + (i < leftover ? 1 : 0); });
      }
      st.offers.filter(o => o.status === 'archived').forEach(o => { o.weight = 0; });
    }

    function sortOffers(list) {
      const active = list.filter(o => o.status === 'active').sort((a,b) => b.weight - a.weight);
      const archived = list.filter(o => o.status === 'archived').sort((a,b) => a.offer_id - b.offer_id);
      return active.concat(archived);
    }

    function renderStreamCard(stream) {
      const st = streamStates[stream.id];
      const div = document.createElement('div');
      div.className = 'stream-card fade-in';
      const title = document.createElement('div');
      title.className = 'stream-head';
      title.innerHTML = '<span class="stream-name">' + (stream.name || 'Stream') + '</span><span class="badge ' + (stream.state === 'active' ? 'badge-active' : 'badge-disabled') + '">' + stream.state + '</span>';
      div.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'stream-meta';
      meta.innerHTML = '<span>id: ' + stream.id + '</span><span>type: ' + stream.type + '</span><span>schema: ' + stream.schema + '</span><span>pos: ' + stream.position + '</span>';
      div.appendChild(meta);

      if (stream.schema !== 'landings') {
        const info = document.createElement('div');
        info.style.padding = '12px';
        info.style.color = 'var(--gray)';
        info.textContent = 'Редирект: ' + (stream.action_payload || '—') + ' (офферы не используются)';
        div.appendChild(info);
        return div;
      }
      const table = document.createElement('table');
      table.className = 'offer-table';
      table.innerHTML = '<thead><tr><th>Оффер</th><th>Вес %</th><th>Закрепить</th><th>Статус</th><th>Действие</th></tr></thead>';
      const tbody = document.createElement('tbody');
      sortOffers(st.offers).forEach(o => {
        const tr = document.createElement('tr');
        if (o.status === 'archived') tr.className = 'archived';
        tr.innerHTML = `
          <td>${o.name} (#${o.offer_id})</td>
          <td><input type="number" class="weight-input" value="${o.weight}" ${o.status==='archived'?'disabled':''} data-oid="${o.offer_id}"></td>
          <td><button class="pin-btn ${o.pinned?'pinned':''}" data-oid="${o.offer_id}" ${o.status==='archived'?'disabled':''}>${o.pinned?'📌':'📍'}</button></td>
          <td class="${o.status==='archived'?'status-archived':''}">${o.status === 'active' ? 'активен' : 'в архиве'}</td>
          <td></td>
        `;
        const actionCell = tr.querySelector('td:last-child');
        if (o.status === 'active') {
          const btn = document.createElement('button');
          btn.className = 'btn btn-danger btn-sm';
          btn.textContent = 'Удалить';
          btn.onclick = () => { removeOffer(stream.id, o.offer_id); };
          actionCell.appendChild(btn);
        } else {
          const btn = document.createElement('button');
          btn.className = 'btn btn-ghost btn-sm';
          btn.textContent = 'Вернуть';
          btn.onclick = () => { restoreOffer(stream.id, o.offer_id); };
          actionCell.appendChild(btn);
        }
        const wInput = tr.querySelector('.weight-input');
        wInput.addEventListener('change', (e) => {
          const val = parseInt(e.target.value);
          if (isNaN(val) || val < 0) return;
          const oo = st.offers.find(x => x.offer_id === o.offer_id);
          if (oo) { oo.weight = val; oo.pinned = true; st.dirty = true; recalcWeights(st); renderStreamById(stream.id); updateButtons(stream.id); }
        });
        const pinBtn = tr.querySelector('.pin-btn');
        pinBtn.addEventListener('click', () => { togglePin(stream.id, o.offer_id); });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      div.appendChild(table);

      // add row
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.style.flexWrap = 'wrap';
      addRow.style.position = 'relative';

      // combobox: search + dropdown in one control
      const comboWrap = document.createElement('div');
      comboWrap.style.cssText = 'flex:1 1 320px; position:relative;';
      const searchInput = document.createElement('input');
      searchInput.type = 'text';
      searchInput.placeholder = '🔍 Поиск и выбор оффера…';
      searchInput.style.cssText = 'width:100%; padding:10px 12px; border:1px solid var(--ivory); background:var(--bg); color:var(--ivory); font-size:13px;';
      const dropdown = document.createElement('div');
      dropdown.style.cssText = 'position:absolute; top:100%; left:0; right:0; max-height:220px; overflow:auto; background:var(--bg); border:1px solid var(--ivory); border-top:none; z-index:10; display:none;';
      comboWrap.appendChild(searchInput);
      comboWrap.appendChild(dropdown);

      let selectedOfferId = null;
      function renderDropdown(filter='') {
        const used = new Set(st.offers.map(o => o.offer_id));
        const q = filter.toLowerCase();
        dropdown.innerHTML = '';
        let count = 0;
        allOffers.forEach(o => {
          if (used.has(o.id)) return;
          if (q && !o.name.toLowerCase().includes(q) && !String(o.id).includes(q)) return;
          const item = document.createElement('div');
          item.style.cssText = 'padding:10px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--gray-2);';
          item.textContent = o.name + '  (#' + o.id + ')';
          item.addEventListener('mouseenter', () => { item.style.background = 'var(--red)'; item.style.color = 'var(--ivory)'; });
          item.addEventListener('mouseleave', () => { item.style.background = ''; item.style.color = ''; });
          item.addEventListener('click', () => {
            selectedOfferId = o.id;
            searchInput.value = o.name + '  (#' + o.id + ')';
            dropdown.style.display = 'none';
          });
          dropdown.appendChild(item);
          count++;
        });
        if (!count) {
          const empty = document.createElement('div');
          empty.style.cssText = 'padding:10px 12px; color:var(--gray); font-size:13px;';
          empty.textContent = 'Ничего не найдено';
          dropdown.appendChild(empty);
        }
        dropdown.style.display = 'block';
      }
      searchInput.addEventListener('focus', () => renderDropdown(searchInput.value));
      searchInput.addEventListener('input', (e) => { selectedOfferId = null; renderDropdown(e.target.value); });
      document.addEventListener('click', (e) => {
        if (!comboWrap.contains(e.target)) dropdown.style.display = 'none';
      });

      addRow.appendChild(comboWrap);

      const addBtn = document.createElement('button');
      addBtn.className = 'btn btn-primary btn-sm';
      addBtn.textContent = '+ Добавить оффер';
      addBtn.onclick = () => {
        if (selectedOfferId === null) {
          // try parse from input
          const m = searchInput.value.match(/#(\d+)/);
          if (m) selectedOfferId = parseInt(m[1]);
        }
        if (isNaN(selectedOfferId)) { showToast('Выбери оффер из списка', true); return; }
        addOffer(stream.id, selectedOfferId);
        selectedOfferId = null;
        searchInput.value = '';
      };
      addRow.appendChild(addBtn);
      div.appendChild(addRow);

      // buttons
      const btnRow = document.createElement('div');
      btnRow.style.marginTop = '16px';
      const syncBtn = document.createElement('button');
      syncBtn.className = 'btn btn-ghost btn-sm';
      syncBtn.id = 'sync-btn-' + stream.id;
      syncBtn.textContent = st.dirty ? 'Подтвердить изменения' : 'Проверить изменения с Keitaro';
      syncBtn.onclick = () => st.dirty ? confirmChanges(stream.id) : syncWithKeitaro(stream.id);
      btnRow.appendChild(syncBtn);
      div.appendChild(btnRow);

      return div;
    }

    function renderStreamById(sid) {
      const card = document.getElementById('card-' + sid);
      if (!card) return;
      const stream = window._streams.find(s => s.id === sid);
      const newCard = renderStreamCard(stream);
      newCard.id = 'card-' + sid;
      card.replaceWith(newCard);
    }

    function updateButtons(sid) {
      const st = getSt(sid);
      const btn = document.getElementById('sync-btn-' + sid);
      if (btn) btn.textContent = st.dirty ? 'Подтвердить изменения' : 'Проверить изменения с Keitaro';
    }

    async function loadCampaigns() {
      try {
        allCampaigns = await (await fetch('/api/editor/campaigns')).json();
        renderCampaigns(allCampaigns);
        const sel = document.getElementById('campaign');
        sel.innerHTML = '';
        allCampaigns.forEach(c => {
          const o = document.createElement('option');
          o.value = c.id;
          o.textContent = c.name + '  (#' + c.id + ')';
          sel.appendChild(o);
        });
      } catch (e) { showToast('Ошибка загрузки кампаний: ' + e, true); }
    }
    function renderCampaigns(list) {
      const container = document.getElementById('campaigns');
      container.innerHTML = '';
      list.forEach(c => {
        const div = document.createElement('div');
        div.className = 'campaign-item';
        div.innerHTML = '<div class="cname">' + c.name + '</div><div class="cid">#' + c.id + '</div>';
        div.onclick = () => {
          document.getElementById('campaign').value = c.id;
          document.getElementById('load').click();
          document.querySelectorAll('.campaign-item').forEach(x => x.classList.remove('active'));
          div.classList.add('active');
        };
        container.appendChild(div);
      });
    }
    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderCampaigns(allCampaigns.filter(c => c.name.toLowerCase().includes(q)));
    });
    loadCampaigns();
    (async () => {
      try { allOffers = await (await fetch('/api/editor/offers')).json(); }
      catch (e) { showToast('Ошибка загрузки офферов: ' + e, true); }
    })();

    async function loadStreamState(streamId) {
      const stream = await (await fetch('/api/editor/streams/' + streamId)).json();
      const keitaroActive = stream.offers || [];
      streamStates[streamId] = { offers: [], dirty: false };
      const st = streamStates[streamId];
      st.offers = keitaroActive.map(ko => {
        const off = allOffers.find(o => o.id === ko.offer_id);
        return { offer_id: ko.offer_id, name: off ? off.name : ('Offer #' + ko.offer_id), weight: ko.share, pinned: false, status: 'active', pending: false };
      });
      return stream;
    }

    async function loadStreams() {
      const cid = document.getElementById('campaign').value;
      if (!cid) return;
      try {
        const streams = await (await fetch('/api/editor/campaigns/' + cid + '/streams')).json();
        const container = document.getElementById('streams');
        container.innerHTML = '';
        window._streams = streams;
        for (const s of streams) {
          await loadStreamState(s.id);
          const card = renderStreamCard(s);
          card.id = 'card-' + s.id;
          container.appendChild(card);
        }
        log('Загружена кампания #' + cid + ' (' + streams.length + ' потоков)');
      } catch (e) {
        showToast('Ошибка: ' + e, true);
      }
    }
    document.getElementById('load').addEventListener('click', loadStreams);

    function addOffer(streamId, offerId) {
      const st = getSt(streamId);
      if (st.offers.find(o => o.offer_id === offerId)) { showToast('Уже добавлен', true); return; }
      const off = allOffers.find(o => o.id === offerId);
      st.offers.push({ offer_id: offerId, name: off ? off.name : ('Offer #' + offerId), weight: 0, pinned: false, status: 'active', pending: true });
      st.dirty = true;
      recalcWeights(st);
      renderStreamById(streamId);
      updateButtons(streamId);
    }

    function removeOffer(streamId, offerId) {
      const st = getSt(streamId);
      const o = st.offers.find(x => x.offer_id === offerId);
      if (!o) return;
      o.status = 'archived'; o.pending = true; o.weight = 0;
      st.dirty = true;
      recalcWeights(st);
      renderStreamById(streamId);
      updateButtons(streamId);
    }

    function restoreOffer(streamId, offerId) {
      const st = getSt(streamId);
      const o = st.offers.find(x => x.offer_id === offerId);
      if (!o) return;
      o.status = 'active'; o.pending = true; o.weight = 0;
      st.dirty = true;
      recalcWeights(st);
      renderStreamById(streamId);
      updateButtons(streamId);
    }

    function togglePin(streamId, offerId) {
      const st = getSt(streamId);
      const o = st.offers.find(x => x.offer_id === offerId);
      if (!o || o.status !== 'active') return;
      o.pinned = !o.pinned;
      st.dirty = true;
      recalcWeights(st);
      renderStreamById(streamId);
      updateButtons(streamId);
    }

    function renderStreamById(sid) {
      const stream = window._streams.find(s => s.id === sid);
      const card = document.getElementById('card-' + sid);
      if (!card || !stream) return;
      const newCard = renderStreamCard(stream);
      newCard.id = 'card-' + sid;
      card.replaceWith(newCard);
    }

    async function syncWithKeitaro(streamId) {
      const st = getSt(streamId);
      try {
        const stream = await (await fetch('/api/editor/streams/' + streamId)).json();
        const keitaroIds = new Set((stream.offers || []).map(o => o.offer_id));
        st.offers.forEach(o => {
          if (o.status === 'active' && !keitaroIds.has(o.offer_id)) {
            o.status = 'archived'; o.pending = false;
          }
        });
        (stream.offers || []).forEach(ko => {
          if (!st.offers.find(o => o.offer_id === ko.offer_id)) {
            const off = allOffers.find(o => o.id === ko.offer_id);
            st.offers.push({ offer_id: ko.offer_id, name: off ? off.name : ('Offer #' + ko.offer_id), weight: ko.share, pinned: false, status: 'active', pending: false });
          } else {
            const o = st.offers.find(x => x.offer_id === ko.offer_id && x.status === 'active');
            if (o) o.weight = ko.share;
          }
        });
        st.dirty = false;
        renderStreamById(streamId);
        updateButtons(streamId);
        showToast('Синхронизировано с Keitaro');
        log('Проверка изменений для stream ' + streamId);
      } catch (e) {
        showToast('Ошибка синхронизации: ' + e, true);
      }
    }

    async function confirmChanges(streamId) {
      const st = getSt(streamId);
      try {
        const active = st.offers.filter(o => o.status === 'active').map(o => ({ offer_id: o.offer_id, share: o.weight }));
        const r = await fetch('/api/editor/streams/' + streamId + '/offers/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ offers: active }) });
        const j = await r.json();
        if (j.ok) {
          showToast('Изменения применены');
          log('Применены изменения для stream ' + streamId);
          // reload from keitaro but keep archived
          const archived = st.offers.filter(o => o.status === 'archived');
          await loadStreamState(streamId);
          const st2 = getSt(streamId);
          archived.forEach(a => {
            if (!st2.offers.find(o => o.offer_id === a.offer_id)) st2.offers.push({ ...a, pending: false });
          });
          st2.dirty = false;
          renderStreamById(streamId);
          updateButtons(streamId);
        } else {
          showToast(j.detail || 'Ошибка', true);
        }
      } catch (e) {
        showToast('Ошибка: ' + e, true);
      }
    }
  </script>
</body>
</html>
